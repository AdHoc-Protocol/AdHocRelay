# The release of a tag v…: pack.sh makes the installers of one file, adhoc-relay-openwrt.sh and adhoc-relay-linux.sh, and
# adhoc-relay-openwrt.tar.gz, the archive the page of LuCI restores ( ../openwrt-web.sh checks it ); each installs
# AdHoc Relay where it is for - OpenWrt booted in Docker as a router ( ../openwrt-install.sh ), this Ubuntu with systemd and Debian
# without ( ../linux-install.sh ) - and then both go into the release of the tag. The links
#   https://github.com/AdHoc-Protocol/AdHocRelay/releases/latest/download/adhoc-relay-openwrt.sh
#   https://github.com/AdHoc-Protocol/AdHocRelay/releases/latest/download/adhoc-relay-linux.sh
# are always the last ones. The server goes beside them: adhoc-relay-server.pl for Linux and macOS, and
# adhoc-relay-server-windows.zip - the script of PowerShell and the .cmd that starts it by a double click.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  openwrt:
    runs-on: ubuntu-latest
    # a feed of OpenWrt that hangs does not hold the release for hours
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: pack
        run: |
          sh pack.sh openwrt adhoc-relay-openwrt.sh
          sh -n adhoc-relay-openwrt.sh
          sh pack.sh openwrt-web adhoc-relay-openwrt.tar.gz

      # the archive the page of LuCI restores, for a router reached by its web page alone
      - name: install by the page of LuCI
        run: |
          for image in openwrt/rootfs:x86-64-openwrt-25.12 openwrt/rootfs:x86-64; do
            echo "::group::$image"
            sh .github/openwrt-web.sh "$image" adhoc-relay-openwrt.tar.gz
            echo "::endgroup::"
          done

      # the last release of OpenWrt, and its snapshot: what the next release brings shows here first
      - name: install on OpenWrt
        run: |
          docker network create --subnet 10.97.0.0/24 router
          for image in openwrt/rootfs:x86-64-openwrt-25.12 openwrt/rootfs:x86-64; do
            echo "::group::$image"
            docker run -d --name router --network router --ip 10.97.0.2 --cap-add NET_ADMIN --cap-add SYS_ADMIN \
              --sysctl net.ipv4.ip_forward=1 -v "$PWD:/src:ro" "$image" /sbin/init
            sleep 8
            docker exec router sh /src/.github/openwrt-install.sh
            docker rm -f router
            echo "::endgroup::"
          done

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # the lines of a server, as both scripts of the server take them: docs/lines.tsv
      - name: the lines
        run: sh .github/lines.sh

      - name: pack
        run: |
          sh pack.sh linux adhoc-relay-linux.sh
          sh -n adhoc-relay-linux.sh

      # this computer: Ubuntu with systemd, iptables and Docker, as a server is
      - name: install with systemd
        run: |
          sudo apt-get install -y nftables >/dev/null
          sudo sh .github/linux-install.sh adhoc-relay-linux.sh

      # Debian in Docker: no systemd, the rules loaded and `give` started by the installer itself
      - name: install without systemd
        run: |
          docker run --rm --cap-add NET_ADMIN -v "$PWD:/src:ro" debian:latest sh -c \
            'apt-get update >/dev/null && apt-get install -y --no-install-recommends nftables iptables procps >/dev/null && cd /src && sh .github/linux-install.sh adhoc-relay-linux.sh'

  release:
    needs: [openwrt, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh pack.sh openwrt adhoc-relay-openwrt.sh
          sh pack.sh openwrt-web adhoc-relay-openwrt.tar.gz
          sh pack.sh linux adhoc-relay-linux.sh
          cp Server/adhoc-relay-server.pl .
          (cd Server && zip -q ../adhoc-relay-server-windows.zip adhoc-relay-server.ps1 adhoc-relay-server.cmd)
          files="adhoc-relay-openwrt.sh adhoc-relay-openwrt.tar.gz adhoc-relay-linux.sh adhoc-relay-server.pl adhoc-relay-server-windows.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            gh release create "$GITHUB_REF_NAME" $files --title "AdHoc Relay $GITHUB_REF_NAME" --generate-notes
          fi
